<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads — Versa Test Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dl-wrap { max-width: 860px; margin: 0 auto; padding: 0 1rem 3rem; }

    .dl-folder {
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      background: var(--white);
      margin-bottom: 1.25rem;
      overflow: hidden;
    }
    .dl-folder-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1rem 1.25rem;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
    }
    .dl-folder-name { font-weight: 600; font-size: .9375rem; flex: 1; }
    .dl-folder-count { font-size: .8rem; color: var(--gray-500); white-space: nowrap; }
    .dl-copy-btn {
      font-size: .75rem;
      padding: .25rem .6rem;
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      background: var(--white);
      color: var(--gray-600);
      cursor: pointer;
      white-space: nowrap;
    }
    .dl-copy-btn:hover { background: var(--gray-100); }

    .dl-file-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .65rem 1.25rem;
      border-bottom: 1px solid var(--gray-100);
    }
    .dl-file-row:last-child { border-bottom: none; }
    .dl-file-name { flex: 1; font-size: .875rem; }
    .dl-file-size { font-size: .8rem; color: var(--gray-400); white-space: nowrap; }
    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .3rem .8rem;
      background: var(--primary);
      color: #fff;
      border-radius: 6px;
      font-size: .8rem;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .dl-btn:hover { opacity: .88; }
    .dl-empty { text-align: center; padding: 3rem 1rem; color: var(--gray-400); }
    .dl-folder-empty { padding: .9rem 1.25rem; color: var(--gray-400); font-size: .85rem; }
  </style>
</head>
<body>

<nav class="navbar">
  <span class="navbar-brand">
    <img src="images/versa-logo.png" height="40" alt="Versa" style="vertical-align:middle">
  </span>
</nav>

<div class="hero" style="padding:3rem 1rem 2rem">
  <h1 style="font-size:1.8rem">Downloads</h1>
  <p>Training materials and resources available for download.</p>
</div>

<div class="dl-wrap">
  <div id="dlContent"><div class="dl-empty">Loading…</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script>
(async () => {
  // Same Apps Script URL used by the portals — reads Drive directly, no Firestore sync needed
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzWq22C2DBLXNflxVpe2nyCEayzPSVXDNfdyDAsaLN2rnrflaKsEDuR9wfA8VEEwzU7zA/exec';

  const container   = document.getElementById('dlContent');
  const filterTestId = new URLSearchParams(location.search).get('test');

  function fmtSize(bytes) {
    bytes = parseInt(bytes) || 0;
    if (!bytes) return '';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  async function listFiles(folderId) {
    const res  = await fetch(`${SCRIPT_URL}?${new URLSearchParams({ action: 'listFiles', folderId })}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data.files || [];
  }

  try {
    // Load tests that have Drive folders from Firestore
    const db   = firebase.firestore();
    const snap = await db.collection('tests').get();
    let tests  = snap.docs.map(d => d.data()).filter(t => t.driveFolderId);

    if (filterTestId) tests = tests.filter(t => t.id === filterTestId);

    if (!tests.length) {
      container.innerHTML = `<div class="dl-empty">No exam folders available yet.</div>`;
      return;
    }

    // Update hero subtitle when filtered to one exam
    if (filterTestId && tests.length === 1) {
      const heroP = document.querySelector('.hero p');
      if (heroP) heroP.textContent = tests[0].title || 'Exam Downloads';
    }

    container.innerHTML = `<div class="dl-empty">Loading files…</div>`;

    // Fetch file list for each folder in parallel
    const results = await Promise.all(tests.map(async t => {
      try   { return { t, files: await listFiles(t.driveFolderId) }; }
      catch (_) { return { t, files: [] }; }
    }));

    const withFiles = results.filter(r => r.files.length > 0);

    if (!withFiles.length) {
      container.innerHTML = `<div class="dl-empty">No files available yet. Check back later.</div>`;
      return;
    }

    container.innerHTML = withFiles.map(({ t, files }) => `
      <div class="dl-folder">
        <div class="dl-folder-header">
          <span style="font-size:1.2rem">📁</span>
          <span class="dl-folder-name">${esc(t.title)}</span>
          <span class="dl-folder-count">${files.length} file${files.length !== 1 ? 's' : ''}</span>
          <button class="dl-copy-btn" onclick="copyFolderLink('${t.id}')">🔗 Copy Link</button>
        </div>
        ${files.map(f => `
          <div class="dl-file-row">
            <span class="dl-file-name">📄 ${esc(f.name)}</span>
            <span class="dl-file-size">${fmtSize(f.size)}</span>
            <a class="dl-btn" href="https://drive.google.com/uc?export=download&id=${f.id}" target="_blank">↓ Download</a>
          </div>`).join('')}
      </div>`).join('');

  } catch (e) {
    container.innerHTML = `<div class="dl-empty">Could not load files. Please try again later.</div>`;
    console.error(e);
  }
})();

function copyFolderLink(testId) {
  const url = `${location.origin}${location.pathname}?test=${testId}`;
  navigator.clipboard.writeText(url)
    .then(() => alert('Link copied!\n' + url))
    .catch(() => prompt('Copy this link:', url));
}
</script>

</body>
</html>
