<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads — Versa Test Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dl-wrap { max-width: 860px; margin: 0 auto; padding: 0 1rem 3rem; }

    .dl-folder {
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      background: var(--white);
      margin-bottom: 1.25rem;
      overflow: hidden;
    }
    .dl-folder-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1rem 1.25rem;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
    }
    .dl-folder-name { font-weight: 600; font-size: .9375rem; flex: 1; }
    .dl-folder-count { font-size: .8rem; color: var(--gray-500); white-space: nowrap; }
    .dl-copy-btn {
      font-size: .75rem;
      padding: .25rem .6rem;
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      background: var(--white);
      color: var(--gray-600);
      cursor: pointer;
      white-space: nowrap;
    }
    .dl-copy-btn:hover { background: var(--gray-100); }

    .dl-file-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .65rem 1.25rem;
      border-bottom: 1px solid var(--gray-100);
    }
    .dl-file-row:last-child { border-bottom: none; }
    .dl-file-name { flex: 1; font-size: .875rem; }
    .dl-file-size { font-size: .8rem; color: var(--gray-400); white-space: nowrap; }
    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .3rem .8rem;
      background: var(--primary);
      color: #fff;
      border-radius: 6px;
      font-size: .8rem;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .dl-btn:hover { opacity: .88; }
    .dl-empty { text-align: center; padding: 3rem 1rem; color: var(--gray-400); }
    .dl-folder-empty { padding: .9rem 1.25rem; color: var(--gray-400); font-size: .85rem; }
  </style>
</head>
<body>

<nav class="navbar">
  <span class="navbar-brand">
    <img src="images/versa-logo.png" height="40" alt="Versa" style="vertical-align:middle">
  </span>
</nav>

<div class="hero" style="padding:3rem 1rem 2rem">
  <h1 style="font-size:1.8rem">Downloads</h1>
  <p>Training materials and resources available for download.</p>
</div>

<div class="dl-wrap">
  <div style="text-align:center;padding:3rem 1rem">
    <div style="font-size:3rem;margin-bottom:1rem">📁</div>
    <h2 style="margin-bottom:.5rem">Training Materials</h2>
    <p style="color:var(--gray-500);margin-bottom:2rem">All training materials and resources are hosted on SharePoint.</p>
    <a href="https://versanetworks.sharepoint.com/:f:/g/IgAEhhHXCJCxQIqNOG6SFdZIAW7S9-BKJ59Oa0xnYtxd5Fo?e=g57niV"
       target="_blank"
       class="btn btn-primary"
       style="font-size:1rem;padding:.75rem 2rem">
      Open SharePoint Folder
    </a>
    <p style="color:var(--gray-400);font-size:.8rem;margin-top:1rem">Opens in a new tab — Versa Networks SharePoint access required.</p>
  </div>
</div>

</body>
</html>
